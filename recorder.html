<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moodrot Sound Studio</title><style>
*{box-sizing:border-box}body{background:#16111b;color:white;font:16px system-ui;margin:0}main{max-width:560px;margin:32px auto;padding:24px}section{background:#2a2030;border-radius:20px;padding:20px;margin:20px 0}p{color:#e0cfe1;line-height:1.5}button,input{font:inherit;padding:12px;border-radius:12px;border:1px solid #805c80;margin:4px 4px 4px 0}button{background:#813061;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #f472b6}input{width:100%;background:#17121b;color:white}audio{width:100%;margin:12px 0}#clock{font-size:28px;color:#f9a8d4}li{margin:12px 0;overflow-wrap:anywhere}li span{display:block}
</style></head><body><main><h1>🎙️ Moodrot Sound Studio</h1><p>Record your own sound bombs. Audio stays in your browser and is not uploaded to Facebook or a Moodrot server. Microphone access begins only when you choose Record.</p><section><div id="clock">0.0 / 10 s</div><button id="record">● Record</button><button id="stop" disabled>■ Stop</button><p id="status" role="status" aria-live="polite">Ready.</p><audio id="preview" controls hidden></audio><label for="name">Sound name</label><input id="name" maxlength="32" placeholder="My legendary sound"><button id="save" disabled>Save sound</button><button id="discard" disabled>Discard</button><p>Up to 10 seconds per sound, 12 saved sounds. Delete anytime.</p></section><section><h2>Your sounds</h2><ul id="list"></ul><button id="close">Back to Facebook</button></section></main><script src="recorder.js"></script></body></html>
